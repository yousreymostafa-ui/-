  set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch{}}
};

let state={
  dark: DB.get('noor_dark',false),
  hist: DB.get('noor_hist',{}),
  duas: DB.get('noor_duas',[]),
  screen:'main', // main | duas | reader | calendar | stats
  tab:'today',
  calYear:new Date().getFullYear(),
  calMonth:new Date().getMonth(),
  calSelDate:null,
  reader:null,
  lastTap:{key:null,time:0},
  readerIdx:0,
  readerCount:0,
  addCustomOpen:false,
  customInput:'',
  addDuaOpen:false,
  duaForm:{text:''},
};

function todayStr(){return new Date().toISOString().split('T')[0];}
function pad(n){return String(n).padStart(2,'0');}
function getT(){return state.hist[todayStr()]||{};}
function nextPrayer(){
  const now=new Date(),cur=now.getHours()*60+now.getMinutes();
  for(const p of PRAYERS){const pm=p.h*60+p.m;if(pm>cur)return{...p,left:pm-cur};}
  return{...PRAYERS[0],left:(24*60-cur)+PRAYERS[0].h*60+PRAYERS[0].m};
}
function calcPct(){
  const t=getT();
  const items=[
    t.morning,t.evening,t.quran,t.qiyam,
    ...SUNNAH.map(s=>(t.sunnah||{})[s.id]),
    ...state.duas.map(d=>(t.duaChecks||{})[d.id]),
    ...(t.customItems||[]).map(c=>c.done)
  ];
  return items.length?Math.round(items.filter(Boolean).length/items.length*100):0;
}
function saveHist(t){
  state.hist[todayStr()]=t;
  DB.set('noor_hist',state.hist);
}
function togKey(key){
  const t={...getT()};
  t[key]=!t[key];
  saveHist(t);
}
function togSunnah(id){
  const t={...getT()};
  t.sunnah={...(t.sunnah||{}),[id]:!(t.sunnah||{})[id]};
  saveHist(t);
}
function togDua(id){
  const t={...getT()};
  t.duaChecks={...(t.duaChecks||{}),[id]:!(t.duaChecks||{})[id]};
  saveHist(t);
}
function addCustomItem(label){
  const t={...getT()};
  t.customItems=[...(t.customItems||[]),{id:Date.now()+'',label,done:false}];
  saveHist(t);
}
function togCustom(id){
  const t={...getT()};
  t.customItems=(t.customItems||[]).map(x=>x.id===id?{...x,done:!x.done}:x);
  saveHist(t);
}
function delCustom(id){
  const t={...getT()};
  t.customItems=(t.customItems||[]).filter(x=>x.id!==id);
  saveHist(t);
}

/* ─── Hijri date helpers ──────────────────────────────────────────────── */
function getHijriDate(date){
  // Use Intl.DateTimeFormat for Islamic calendar
  try{
    const fmt=new Intl.DateTimeFormat('ar-SA-u-ca-islamic',{day:'numeric',month:'numeric',year:'numeric'});
    const parts=fmt.formatToParts(date);
    const get=t=>parseInt(parts.find(p=>p.type===t).value.replace(/[^0-9]/g,''));
    return {day:get('day'),month:get('month'),year:get('year')};
  }catch(e){return null;}
}

function getAyyamBeedAlert(){
  const today=new Date();
  const h=getHijriDate(today);
  if(!h)return null;
  // الأيام البيض: 13, 14, 15 من كل شهر هجري
  // نبه قبل 3 أيام: أي إذا كان اليوم 10, 11, 12
  const fastDays=[13,14,15];
  const alertDays=[10,11,12];
  if(fastDays.includes(h.day)){
    return {type:'fasting',day:h.day,msg:`اليوم ${h.day} من الشهر - يوم صيام من الأيام البيض 🌕`};
  }
  if(alertDays.includes(h.day)){
    const daysLeft=13-h.day;
    return {type:'upcoming',day:h.day,daysLeft,msg:`تنبيه: الأيام البيض بعد ${daysLeft} ${daysLeft===1?'يوم':'أيام'} (١٣-١٥ ${getHijriMonthName(h.month)}) 🌙`};
  }
  return null;
}

function getHijriMonthName(m){return HIJRI_MONTHS[(m-1)%12]||'';}

  const root=document.getElementById('root');
  root.style.background=C.bg;
  root.style.color=C.T;

  if(state.screen==='reader') root.innerHTML=renderReader();
  else if(state.screen==='duas') root.innerHTML=renderDuasPage();
  else if(state.screen==='calendar') root.innerHTML=renderCalendar();
  else if(state.screen==='stats') root.innerHTML=renderStats();
  else root.innerHTML=renderMain();

  attachEvents();
  if(state.screen==='stats') setTimeout(drawCharts,50);
}

  render();

    if(page) page.scrollTop=scrollY;
  }
}

/* ═══════════════════════════════════════════════════════════
   HELPERS
═══════════════════════════════════════════════════════════ */
function calcPct2(t){
  if(!t)return 0;
  const items=[
    t.morning,t.evening,t.quran,t.qiyam,
    ...SUNNAH.map(s=>(t.sunnah||{})[s.id]),
    ...state.duas.map(d=>(t.duaChecks||{})[d.id]),
    ...(t.customItems||[]).map(c=>c.done)
  ];
  return items.length?Math.round(items.filter(Boolean).length/items.length*100):0;
}
const TAB_ICONS={
  today:`<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C9.5 2 8 4 8 6c0 1.5.8 2.8 2 3.5V11H8l-1 2h10l-1-2h-2V9.5c1.2-.7 2-2 2-3.5 0-2-1.5-4-4-4zm0 1.5c1.4 0 2.5 1.1 2.5 2.5S13.4 8.5 12 8.5 9.5 7.4 9.5 6 10.6 3.5 12 3.5zM4 14v7h16v-7H4zm2 1.5h12v4H6v-4z" opacity=".9"/></svg>`,
  calendar:`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="4" width="18" height="17" rx="3"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="16" y1="2" x2="16" y2="6"/><circle cx="8" cy="13" r="1" fill="currentColor" stroke="none"/><circle cx="12" cy="13" r="1" fill="currentColor" stroke="none"/><circle cx="16" cy="13" r="1" fill="currentColor" stroke="none"/><circle cx="8" cy="17" r="1" fill="currentColor" stroke="none"/><circle cx="12" cy="17" r="1" fill="currentColor" stroke="none"/></svg>`,
  stats:`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a7 7 0 0 1 0 14"/><path d="M12 2a7 7 0 0 0 0 14"/><circle cx="12" cy="9" r="2" fill="currentColor" stroke="none"/><line x1="12" y1="16" x2="12" y2="20"/><circle cx="12" cy="21" r="1.5" fill="currentColor" stroke="none"/><line x1="7" y1="19" x2="17" y2="19" stroke-width="1"/></svg>`
};
function renderTabBar(){
  const tabs=[{id:'today',label:'اليوم'},{id:'calendar',label:'السجل'},{id:'stats',label:'التحليل'}];
  return `<div id="tab-bar">
  ${tabs.map(tab=>{
    const active=state.screen===tab.id||(tab.id==='today'&&state.screen==='main');
    const col=active?C.A:'#6a9e7a';
    return `<button data-action="nav-tab" data-tab="${tab.id}" style="color:${col};font-weight:${active?700:400};">
      <span class="ico" style="color:${col};">${TAB_ICONS[tab.id]}</span><span class="lbl">${tab.label}</span>
    </button>`;
  }).join('')}
</div>`;
}

/* ═══════════════════════════════════════════════════════════
   CALENDAR PAGE
═══════════════════════════════════════════════════════════ */
function renderCalendar(){
  const yr=state.calYear,mo=state.calMonth;
  const firstDay=new Date(yr,mo,1).getDay();
  const daysInMonth=new Date(yr,mo+1,0).getDate();
  const today=todayStr();
  const selDate=state.calSelDate||today;
  const mNames=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  const dayAbbr=['أح','إث','ثل','أر','خم','جم','سب'];
  let cells='';
  for(let i=0;i<firstDay;i++) cells+=`<div></div>`;
  for(let d=1;d<=daysInMonth;d++){

function getStatsData(){
  const allDates=Object.keys(state.hist).sort();
  if(!allDates.length)return null;
  const totalDays=allDates.length;
  const completedDays=allDates.filter(d=>calcPct2(state.hist[d])===100).length;
  const avgPct=Math.round(allDates.reduce((s,d)=>s+calcPct2(state.hist[d]),0)/totalDays);
  let streak=0;let check=todayStr();
  while(state.hist[check]&&calcPct2(state.hist[check])===100){streak++;const d=new Date(check+'T12:00:00');d.setDate(d.getDate()-1);check=d.toISOString().split('T')[0];}
  const last30=[];
  for(let i=29;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const ds=d.toISOString().split('T')[0];last30.push({date:ds,pct:calcPct2(state.hist[ds]||null),label:d.getDate()});}
  const tasks=[
    {label:'أذكار الصباح',fn:t=>t.morning},{label:'أذكار المساء',fn:t=>t.evening},
    {label:'ورد القرآن',fn:t=>t.quran},{label:'قيام الليل',fn:t=>t.qiyam},
    ...SUNNAH.map(s=>({label:s.name,fn:t=>(t.sunnah||{})[s.id]})),
  ];
  const taskStats=tasks.map(tk=>({label:tk.label,pct:allDates.length?Math.round(allDates.filter(d=>tk.fn(state.hist[d])).length/allDates.length*100):0})).sort((a,b)=>b.pct-a.pct);
  return {totalDays,completedDays,avgPct,streak,last30,taskStats};
}

function drawCharts(){
  const data=getStatsData();
  if(!data)return;
  const dark=state.dark;
  // Bar chart
  const bc=document.getElementById('barChart');
  if(bc){
    const dpr=Math.min(window.devicePixelRatio||1,2);
    const W=bc.offsetWidth||320;
    const H=130;
    bc.width=W*dpr;bc.height=H*dpr;
    bc.style.width=W+'px';bc.style.height=H+'px';
    const ctx=bc.getContext('2d');
    ctx.scale(dpr,dpr);
    ctx.clearRect(0,0,W,H);
    const n=data.last30.length;
    const bw=(W-16)/n;
    const gap=Math.max(1,bw*0.15);
    data.last30.forEach((d,i)=>{
      const x=8+i*bw+gap/2;
      const w2=bw-gap;
      const barH=Math.max(d.pct>0?3:0,d.pct/100*(H-16));
      const y=H-8-barH;
      if(d.pct===100)ctx.fillStyle='#c9a227';
      else if(d.pct>=60)ctx.fillStyle='#2d7a55';
      else if(d.pct>0)ctx.fillStyle=dark?'#2d7a5566':'#2d7a5544';
      else ctx.fillStyle=dark?'#1a3d2a':'#e4dece';
      const r=Math.min(2,w2/2);
      ctx.beginPath();
      ctx.moveTo(x+r,y);ctx.lineTo(x+w2-r,y);ctx.arcTo(x+w2,y,x+w2,y+r,r);
      ctx.lineTo(x+w2,y+barH);ctx.lineTo(x,y+barH);ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);
      ctx.closePath();ctx.fill();
    });
    ctx.fillStyle=dark?'#2d7a5533':'#ddd6c6';
    ctx.fillRect(8,H-8,W-16,1);
  }
  // Donut chart
  const dc=document.getElementById('donutChart');
  if(dc){
    const dpr=Math.min(window.devicePixelRatio||1,2);
    dc.width=110*dpr;dc.height=110*dpr;
    const ctx=dc.getContext('2d');
    ctx.scale(dpr,dpr);
    const cx=55,cy=55,r=40,lw=12;
    const frac=data.totalDays>0?data.completedDays/data.totalDays:0;
    ctx.beginPath();ctx.arc(cx,cy,r,0,2*Math.PI);
    ctx.strokeStyle=dark?'#1a3d2a':'#ddd6c6';ctx.lineWidth=lw;ctx.stroke();
    if(frac>0){
      ctx.beginPath();ctx.arc(cx,cy,r,-Math.PI/2,-Math.PI/2+frac*2*Math.PI);
      ctx.strokeStyle='#c9a227';ctx.lineWidth=lw;ctx.lineCap='round';ctx.stroke();
    }
    ctx.fillStyle=dark?'#e8dfc8':'#1a2e22';
    ctx.font=`700 16px Cairo,sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(Math.round(frac*100)+'%',cx,cy);
  }
}

/* ═══════════════════════════════════════════════════════════
   EVENTS
═══════════════════════════════════════════════════════════ */
function attachEvents(){
  document.querySelectorAll('[data-action]').forEach(el=>{
    el.addEventListener('click',handleAction);
  });
  // inputs live update
  const ti=document.getElementById('dua-title');
  const tt=document.getElementById('dua-text');
  if(ti)ti.addEventListener('input',e=>{state.duaForm.title=e.target.value;});
  if(tt)tt.addEventListener('input',e=>{state.duaForm.text=e.target.value;});
  const ci=document.getElementById('custom-input');
  if(ci){
    ci.addEventListener('input',e=>{state.customInput=e.target.value;});
    ci.addEventListener('keydown',e=>{if(e.key==='Enter')saveCustom();});
  }
  // Reader swipe gestures - horizontal only, minimum 50px
  const rp=document.getElementById('reader-page');
  if(rp){
    let swX=0,swY=0;
    rp.addEventListener('touchstart',e=>{
      swX=e.touches[0].clientX;
      swY=e.touches[0].clientY;
    },{passive:true});
    rp.addEventListener('touchend',e=>{
      const dx=e.changedTouches[0].clientX-swX;
      const dy=e.changedTouches[0].clientY-swY;
      // Must be horizontal dominant and >50px
      if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5){
        if(dx<0){
          // Swipe left = next dhikr
          const item=state.reader.items[state.readerIdx];
          if(item.count===1||state.readerCount>=item.count){
            if(state.readerIdx===state.reader.items.length-1){
              togKey(state.reader.key);
              state.screen='main';state.reader=null;state.readerIdx=0;state.readerCount=0;
            }else{state.readerIdx++;state.readerCount=0;}
            render();
          }
        }else{
          // Swipe right = previous dhikr
          if(state.readerIdx>0){state.readerIdx--;state.readerCount=0;render();}
        }
      }
    },{passive:true});
  }
}

function handleAction(e){
  const el=e.currentTarget;
  const action=el&&el.dataset?el.dataset.action:null;
  if(!action)return;

  if(action==='toggle-dark'){
    state.dark=!state.dark;
    DB.set('noor_dark',state.dark);
    render(); return;
  }
  if(action==='tog-key'){
    togKey(el.dataset.key);
    render(); return;
  }
  if(action==='tog-sunnah'){
    togSunnah(el.dataset.id);
    render(); return;
  }
  if(action==='open-reader'){
    const key=el.dataset.key;
    const which=el.dataset.items;
    state.screen='reader';
    state.reader={items:which==='morning'?MORNING:EVENING,title:which==='morning'?'أذكار الصباح':'أذكار المساء',icon:which==='morning'?'🌅':'🌆',key};
    state.readerIdx=0;
    state.readerCount=0;
    render(); return;
  }
  if(action==='reader-tap'){
    const item=state.reader.items[state.readerIdx];
    if(state.readerCount<item.count)state.readerCount++;
    render(); return;
  }
  if(action==='reader-reset'){state.readerCount=0;render();return;}
  if(action==='reader-prev'){
    if(state.readerIdx>0){state.readerIdx--;state.readerCount=0;render();}
    return;
  }
  if(action==='reader-next'){
    if(state.readerIdx===state.reader.items.length-1){
      togKey(state.reader.key);
      state.screen='main';state.reader=null;state.readerIdx=0;state.readerCount=0;
    }else{state.readerIdx++;state.readerCount=0;}
    render(); return;
  }
  if(action==='reader-close'){
    state.screen='main';state.reader=null;state.readerIdx=0;state.readerCount=0;
    render(); return;
  }
  if(action==='open-duas'){state.screen='duas';render();return;}
  if(action==='back-main'){state.screen='main';state.addDuaOpen=false;render();return;}
  if(action==='toggle-dua-form'){state.addDuaOpen=!state.addDuaOpen;render();return;}
  if(action==='save-dua'){
    const tx=document.getElementById('dua-text')?.value||state.duaForm.text;
    if(!tx.trim())return;
    state.duas=[...state.duas,{id:Date.now()+'',text:tx.trim(),fav:false}];
    DB.set('noor_duas',state.duas);
    state.duaForm={text:''};state.addDuaOpen=false;
    render(); return;
  }
  if(action==='tog-dua'){
    togDua(el.dataset.id);
    render(); return;
  }
  if(action==='fav-dua'){
    const id=el.dataset.id;
    state.duas=state.duas.map(d=>d.id===id?{...d,fav:!d.fav}:d);
    DB.set('noor_duas',state.duas);
    render();return;
  }
  if(action==='del-dua'){
    const id=el.dataset.id;
    state.duas=state.duas.filter(d=>d.id!==id);
    DB.set('noor_duas',state.duas);
    render(); return;
  }
  if(action==='toggle-add-custom'){state.addCustomOpen=!state.addCustomOpen;state.customInput='';render();return;}
  if(action==='save-custom'){saveCustom();return;}
  if(action==='tog-custom'){togCustom(el.dataset.id);render();return;}
  if(action==='del-custom'){delCustom(el.dataset.id);render();return;}
  if(action==='dbtap-key'){
    const key=el.dataset.key,now=Date.now();
    if(state.lastTap.key===key&&(now-state.lastTap.time)<350){
      const page=document.querySelector('.page');
      const scrollY=page?page.scrollTop:0;
      togKey(key);state.lastTap={key:null,time:0};renderKeepScroll(scrollY);
    }else{
      state.lastTap={key,time:now};
      el.style.transform='scale(0.97)';
      setTimeout(()=>{try{el.style.transform='';}catch(e){}},150);
    }
    return;
  }
  if(action==='dbtap-sunnah'){
    const id=el.dataset.id,tk='s_'+id,now=Date.now();
    if(state.lastTap.key===tk&&(now-state.lastTap.time)<350){
      const page=document.querySelector('.page');
      const scrollY=page?page.scrollTop:0;
      togSunnah(id);state.lastTap={key:null,time:0};renderKeepScroll(scrollY);
    }else{
      state.lastTap={key:tk,time:now};
      el.style.transform='scale(0.97)';
      setTimeout(()=>{try{el.style.transform='';}catch(e){}},150);
    }
    return;
  }
  if(action==='nav-tab'){
    const tab=el.dataset.tab;
    if(tab==='today'){state.screen='main';}
    else{state.screen=tab;}
    render();return;
  }
  if(action==='cal-prev'){
    state.calMonth--;
    if(state.calMonth<0){state.calMonth=11;state.calYear--;}
    render();return;
  }
  if(action==='cal-next'){
    state.calMonth++;
    if(state.calMonth>11){state.calMonth=0;state.calYear++;}
    render();return;
  }
  if(action==='cal-day'){
    const d=el.dataset.date;
    if(d<=todayStr()){state.calSelDate=d;render();}
    return;
  }
}

function saveCustom(){
  const ci=document.getElementById('custom-input');
  const val=ci?ci.value.trim():state.customInput.trim();
  if(!val)return;
  addCustomItem(val);
  state.customInput='';state.addCustomOpen=false;
  render();
}

/* ═══════════════════════════════════════════════════════════
   BOOT
═══════════════════════════════════════════════════════════ */
render();
// Refresh prayer time every minute
setInterval(()=>{ if(state.screen==='main'||state.screen==='calendar'||state.screen==='stats')render(); },60000);

// Handle shortcuts from manifest
(function(){
  const p=new URLSearchParams(location.search);
  const sc=p.get('shortcut');
  if(sc==='morning'||sc==='evening'){
    state.screen='reader';
    state.reader={items:sc==='morning'?MORNING:EVENING,title:sc==='morning'?'أذكار الصباح':'أذكار المساء',icon:sc==='morning'?'🌅':'🌆',key:sc};
    state.readerIdx=0;state.readerCount=0;
    render();
  }
})();

// Register Service Worker (silently fails in Chrome/non-PWA context - expected)
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
}

// PWA install prompt
let deferredPrompt;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
});
</script>
