<!doctype html>
<html lang='ar' dir='rtl'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><meta name='theme-color' content='#173f35'><title>أدعيتي</title>
<style>
:root{--bg:#f7f3e9;--card:#fffdf8;--text:#17221d;--muted:#788079;--a:#173f35;--soft:#dfe8e3;--b:#e4ded0;--fs:24px;--lh:2;--pad:18px;--shadow:0 10px 30px #0001}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif;min-height:100vh}body.dark{--bg:#101613;--card:#17201c;--text:#eef5f1;--muted:#a2afa8;--b:#2c3932;--soft:#22372e}button,input,textarea,select{font:inherit}.app{max-width:720px;margin:auto;padding-bottom:92px}.top{position:sticky;top:0;z-index:5;padding:calc(16px + env(safe-area-inset-top)) 16px 10px;background:#f7f3e9ee;backdrop-filter:blur(14px)}body.dark .top{background:#101613ee}h1{margin:0;font-size:28px}.sub{color:var(--muted);font-size:12px;margin-top:3px}.head{display:flex;justify-content:space-between;align-items:center}.icon,.btn,.chip,.nav{border:1px solid var(--b);background:var(--card);color:var(--text);border-radius:14px}.icon{width:44px;height:44px}.search{width:100%;margin-top:12px;height:48px;border:1px solid var(--b);background:var(--card);color:var(--text);border-radius:15px;padding:0 14px}.chips{display:flex;gap:7px;overflow:auto;padding:10px 16px}.chip{white-space:nowrap;padding:8px 12px}.chip.on,.primary{background:var(--a);color:#fff;border-color:var(--a)}main{padding:8px 16px}.cards{display:grid;gap:10px}.card{background:var(--card);padding:var(--pad);border:1px solid var(--b);border-radius:20px}.card.elevated{box-shadow:var(--shadow);border-color:transparent}.card.flat{border-color:transparent}.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.title{font-weight:800}.tag{display:inline-block;margin-top:6px;background:var(--soft);color:var(--a);padding:4px 8px;border-radius:99px;font-size:11px}.dua{font-size:calc(var(--fs)*.75);line-height:var(--lh);margin:12px 0 0}.center .dua,.center .readerText,.center .preview{text-align:center}.actions{display:flex;gap:4px}.actions button{border:0;background:transparent;color:var(--muted);font-size:20px}.fav.on{color:#b08b2c}.fab{position:fixed;left:max(18px,calc((100vw - 720px)/2 + 18px));bottom:calc(84px + env(safe-area-inset-bottom));width:58px;height:58px;border:0;border-radius:19px;background:var(--a);color:white;font-size:30px;box-shadow:var(--shadow)}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(720px,100%);display:grid;grid-template-columns:repeat(3,1fr);padding:8px 14px calc(8px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--b)}.nav{border:0;background:transparent;padding:9px;color:var(--muted)}.nav.on{background:var(--soft);color:var(--a);font-weight:700}.overlay,.reader{display:none;position:fixed;inset:0;z-index:20;background:#0006}.overlay.show{display:flex;align-items:flex-end;justify-content:center}.sheet{width:min(720px,100%);max-height:92vh;overflow:auto;background:var(--bg);padding:18px;border-radius:26px 26px 0 0}.sheet h2{margin:0 0 14px}.field{width:100%;border:1px solid var(--b);background:var(--card);color:var(--text);border-radius:14px;padding:12px;margin:5px 0 10px}.field.ta{min-height:150px;resize:vertical}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{padding:12px 15px}.primary{border:0}.formActions{display:flex;gap:8px}.formActions>*{flex:1}.reader.show{display:block;background:var(--bg);overflow:auto}.readerInner{max-width:720px;margin:auto;padding:calc(16px + env(safe-area-inset-top)) 18px}.readerText{font-size:var(--fs);line-height:var(--lh);padding:var(--pad);margin:48px auto;white-space:pre-wrap}.readerBar{display:flex;justify-content:space-between}.readerBtns{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.readerBtns button{min-height:48px}.settings{display:none}.settings.show{display:block}.home.hide{display:none}.setting{background:var(--card);border:1px solid var(--b);border-radius:18px;padding:14px;margin-bottom:10px}.setting label{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px}input[type=range]{width:100%;accent-color:var(--a)}.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.seg.two{grid-template-columns:1fr 1fr}.seg button{min-height:40px}.preview{background:var(--card);border:1px solid var(--b);border-radius:18px;padding:var(--pad);font-size:var(--fs);line-height:var(--lh);margin-bottom:10px}.empty{text-align:center;color:var(--muted);padding:50px 10px}
</style></head><body><div class='app'>
<section class='home' id='home'><header class='top'><div class='head'><div><h1>أدعيتي</h1><div class='sub'>مساحتك الخاصة للدعاء والذكر</div></div><button class='icon' id='settingsTop'>⚙︎</button></div><input id='search' class='search' placeholder='ابحث في أدعيتك...'></header><div id='chips' class='chips'></div><main><div id='cards' class='cards'></div><div id='empty' class='empty' hidden>لا توجد أدعية هنا<br><button class='btn primary' id='firstAdd' style='margin-top:12px'>أضف دعاء</button></div></main><button class='fab' id='add'>＋</button></section>
<section class='settings' id='settings'><header class='top'><div class='head'><div><h1 style='font-size:24px'>تخصيص القراءة</h1><div class='sub'>عدّل العرض كما يناسبك</div></div><button class='icon' id='reset'>↺</button></div></header><main><div class='preview'>رَبِّ اشْرَحْ لِي صَدْرِي وَيَسِّرْ لِي أَمْرِي</div><div class='setting'><label><span>حجم الخط</span><b id='fsv'></b></label><input type='range' id='fs' min='18' max='42'></div><div class='setting'><label><span>تباعد السطور</span><b id='lhv'></b></label><input type='range' id='lh' min='1.5' max='2.6' step='.1'></div><div class='setting'><label><span>المساحة الداخلية</span><b id='pv'></b></label><input type='range' id='pad' min='12' max='32'></div><div class='setting'><b>المحاذاة</b><div class='seg two' id='align'><button class='btn' data-v='right'>يمين</button><button class='btn' data-v='center'>توسيط</button></div></div><div class='setting'><b>شكل البطاقات</b><div class='seg' id='style'><button class='btn' data-v='flat'>بسيط</button><button class='btn' data-v='bordered'>بإطار</button><button class='btn' data-v='elevated'>بارز</button></div></div><div class='setting'><b>المظهر</b><div class='seg two' id='theme'><button class='btn' data-v='light'>فاتح</button><button class='btn' data-v='dark'>ليلي</button></div></div><div class='setting'><b>لون الواجهة</b><div class='seg' id='accent'><button class='btn' data-v='green'>أخضر</button><button class='btn' data-v='teal'>تركواز</button><button class='btn' data-v='sand'>رملي</button></div></div></main></section>
</div><nav class='bottom'><button class='nav on' data-page='home'>⌂<br>الرئيسية</button><button class='nav' data-page='fav'>★<br>المفضلة</button><button class='nav' data-page='settings'>⚙︎<br>الإعدادات</button></nav>
<div class='overlay' id='form'><div class='sheet'><div class='head'><h2 id='formTitle'>إضافة دعاء</h2><button class='icon' id='formClose'>×</button></div><input id='title' class='field' placeholder='عنوان الدعاء'><textarea id='text' class='field ta' placeholder='نص الدعاء'></textarea><div class='grid2'><select id='cat' class='field'><option>الصباح</option><option>المساء</option><option>الرزق</option><option>الشفاء</option><option>السفر</option><option selected>أخرى</option></select><input id='note' class='field' placeholder='ملاحظة أو مصدر'></div><label><input type='checkbox' id='favorite'> مفضلة</label><div class='formActions'><button class='btn primary' id='save'>حفظ</button><button class='btn' id='cancel'>إلغاء</button></div></div></div>
<section class='reader' id='reader'><div class='readerInner'><div class='readerBar'><button class='icon' id='readerClose'>×</button><b id='readerTitle'></b><button class='icon' id='focus'>◐</button></div><div class='readerText' id='readerText'></div><div class='sub' id='readerNote'></div><div class='readerBtns' id='readerBtns'><button class='btn' id='prev'>‹</button><button class='btn' id='rfav'>☆</button><button class='btn' id='copy'>⧉</button><button class='btn' id='edit'>✎</button><button class='btn' id='next'>›</button></div></div></section>
<script>
const K='duaa_v2',S='duaa_settings_v2',cats=['الكل','المفضلة','الصباح','المساء','الرزق','الشفاء','السفر','أخرى'],seed=[['دعاء الدنيا والآخرة','رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ'],['تيسير الأمر','رَبِّ اشْرَحْ لِي صَدْرِي وَيَسِّرْ لِي أَمْرِي'],['التوكل على الله','حَسْبُنَا اللَّهُ وَنِعْمَ الْوَكِيلُ']].map((x,i)=>({id:crypto.randomUUID(),title:x[0],text:x[1],cat:'أخرى',note:'',fav:i!=1,order:i}));
let d=JSON.parse(localStorage.getItem(K)||'null')||seed,s={fs:24,lh:2,pad:18,align:'right',style:'bordered',theme:'light',accent:'green',...JSON.parse(localStorage.getItem(S)||'{}')},filter='الكل',q='',editId=null,readId=null,focusMode=false;
const $=x=>document.querySelector(x),$$=x=>[...document.querySelectorAll(x)],saveD=()=>localStorage.setItem(K,JSON.stringify(d)),saveS=()=>localStorage.setItem(S,JSON.stringify(s)),esc=x=>(x||'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
function apply(){document.documentElement.style.cssText+=`--fs:${s.fs}px;--lh:${s.lh};--pad:${s.pad}px`;document.body.classList.toggle('dark',s.theme==='dark');document.body.classList.toggle('center',s.align==='center');let a={green:['#173f35','#dfe8e3'],teal:['#17605f','#dceceb'],sand:['#8b6a3c','#efe5d4']}[s.accent];document.documentElement.style.setProperty('--a',a[0]);document.documentElement.style.setProperty('--soft',a[1]);$('#fs').value=s.fs;$('#lh').value=s.lh;$('#pad').value=s.pad;$('#fsv').textContent=s.fs+'px';$('#lhv').textContent=s.lh;$('#pv').textContent=s.pad+'px';$$('[data-v]').forEach(b=>b.classList.toggle('primary',s.align===b.dataset.v||s.style===b.dataset.v||s.theme===b.dataset.v||s.accent===b.dataset.v));render()}
function list(){let a=d.slice().sort((x,y)=>x.order-y.order);if(filter==='المفضلة')a=a.filter(x=>x.fav);else if(filter!=='الكل')a=a.filter(x=>x.cat===filter);if(q)a=a.filter(x=>(x.title+x.text+x.note).includes(q));return a}
function render(){$('#chips').innerHTML=cats.map(x=>`<button class='chip ${filter===x?'on':''}' data-c='${x}'>${x}</button>`).join('');$$('[data-c]').forEach(b=>b.onclick=()=>{filter=b.dataset.c;render()});let a=list();$('#empty').hidden=!!a.length;$('#cards').innerHTML=a.map(x=>`<article class='card ${s.style}' data-id='${x.id}'><div class='row'><div><div class='title'>${esc(x.title)}</div><span class='tag'>${x.cat}</span></div><div class='actions'><button class='fav ${x.fav?'on':''}' data-a='fav'>${x.fav?'★':'☆'}</button><button data-a='edit'>✎</button><button data-a='del'>×</button></div></div><div class='dua'>${esc(x.text)}</div></article>`).join('');$$('.card').forEach(c=>c.onclick=e=>{let a=e.target.dataset.a,id=c.dataset.id;if(a){e.stopPropagation();if(a==='fav'){let x=d.find(z=>z.id===id);x.fav=!x.fav;saveD();render()}if(a==='edit')openForm(id);if(a==='del'&&confirm('حذف الدعاء؟')){d=d.filter(z=>z.id!==id);saveD();render()}}else openReader(id)})}
function openForm(id){editId=id||null;let x=id?d.find(z=>z.id===id):null;$('#formTitle').textContent=x?'تعديل الدعاء':'إضافة دعاء';$('#title').value=x?.title||'';$('#text').value=x?.text||'';$('#cat').value=x?.cat||'أخرى';$('#note').value=x?.note||'';$('#favorite').checked=!!x?.fav;$('#form').classList.add('show')}
function closeForm(){editId=null;$('#form').classList.remove('show')}
function openReader(id){readId=id;focusMode=false;$('#reader').classList.add('show');updateReader()}
function updateReader(){let x=d.find(z=>z.id===readId);if(!x)return;$('#readerTitle').textContent=x.title;$('#readerText').textContent=x.text;$('#readerNote').textContent=x.note;$('#rfav').textContent=x.fav?'★':'☆';$('#readerBtns').style.display=focusMode?'none':'grid'}
function step(n){let a=d.slice().sort((x,y)=>x.order-y.order),i=a.findIndex(x=>x.id===readId);readId=a[(i+n+a.length)%a.length].id;updateReader()}
function page(p){let set=p==='settings';$('#settings').classList.toggle('show',set);$('#home').classList.toggle('hide',set);if(p==='fav')filter='المفضلة';if(p==='home'&&filter==='المفضلة')filter='الكل';$$('.nav').forEach(x=>x.classList.toggle('on',x.dataset.page===p));render()}
$('#search').oninput=e=>{q=e.target.value;render()};$('#add').onclick=$('#firstAdd').onclick=()=>openForm();$('#settingsTop').onclick=()=>page('settings');$('#formClose').onclick=$('#cancel').onclick=closeForm;$('#save').onclick=()=>{let title=$('#title').value.trim(),text=$('#text').value.trim();if(!title||!text)return alert('أدخل العنوان والنص');let x=editId?d.find(z=>z.id===editId):{id:crypto.randomUUID(),order:d.length};Object.assign(x,{title,text,cat:$('#cat').value,note:$('#note').value,fav:$('#favorite').checked});if(!editId)d.push(x);saveD();closeForm();render()};$('#readerClose').onclick=()=>$('#reader').classList.remove('show');$('#rfav').onclick=()=>{let x=d.find(z=>z.id===readId);x.fav=!x.fav;saveD();updateReader()};$('#copy').onclick=()=>navigator.clipboard.writeText(d.find(z=>z.id===readId).text);$('#edit').onclick=()=>{let id=readId;$('#reader').classList.remove('show');openForm(id)};$('#prev').onclick=()=>step(-1);$('#next').onclick=()=>step(1);$('#focus').onclick=()=>{focusMode=!focusMode;updateReader()};$$('.nav').forEach(x=>x.onclick=()=>page(x.dataset.page));[['#align','align'],['#style','style'],['#theme','theme'],['#accent','accent']].forEach(([id,k])=>$$(id+' button').forEach(b=>b.onclick=()=>{s[k]=b.dataset.v;saveS();apply()}));[['#fs','fs'],['#lh','lh'],['#pad','pad']].forEach(([id,k])=>$(id).oninput=e=>{s[k]=+e.target.value;saveS();apply()});$('#reset').onclick=()=>{s={fs:24,lh:2,pad:18,align:'right',style:'bordered',theme:'light',accent:'green'};saveS();apply()};apply();
</script></body></html>
